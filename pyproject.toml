[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyprint-linux"
version = "0.1.0"
description = "Linux monochrome printing for the Tiny Print X6h"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
tinyprint = "tinyprint.cli:main"

[tool.setuptools.packages.find]
include = ["tinyprint*"]
